    <!-- Critical inline CSS — rendu immédiat sans blocage (above-the-fold) -->
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
      body{font-family:'Outfit',system-ui,-apple-system,sans-serif;background:#111;color:#f4f4f5;min-height:100vh;overflow-x:hidden}
      #root{min-height:100vh;position:relative}
      /* ── Anti-FOUC : cache le HTML SEO statique injecté dans #root avant que
         React ne monte. Appliqué avant le premier paint (style inline dans <head>).
         Les crawlers lisent quand même le DOM — seul l'affichage visuel est masqué. */
      #prerender{
        position:absolute;width:1px;height:1px;padding:0;margin:-1px;
        overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
        pointer-events:none;
      }
      /* Barre de chargement animée — visible tant que #root ne contient que
         du contenu non-React (prerender uniquement, pas d'éléments React) */
      #root:not(:has(> :not(#prerender,noscript)))::before{
        content:'';display:block;width:100%;height:4px;
        background:linear-gradient(90deg,#10B981 0%,#059669 50%,#10B981 100%);
        background-size:200% 100%;
        animation:abs-load 1.4s ease-in-out infinite;
        position:fixed;top:0;left:0;z-index:9999;
      }
      /* Fallback :empty pour navigateurs sans :has() */
      #root:empty::before{
        content:'';display:block;width:100%;height:4px;
        background:linear-gradient(90deg,#10B981 0%,#059669 50%,#10B981 100%);
        background-size:200% 100%;
        animation:abs-load 1.4s ease-in-out infinite;
        position:fixed;top:0;left:0;z-index:9999;
      }
      @keyframes abs-load{0%{background-position:200% 0}100%{background-position:-200% 0}}
      /* Prevent layout shift for navbar */
      .nav-root{height:60px}
      img{max-width:100%;height:auto}
    </style>
