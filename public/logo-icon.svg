<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#F0B429"/>
      <stop offset="100%" style="stop-color:#E8960A"/>
    </linearGradient>
    <radialGradient id="circleGrad2" cx="35%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#2A1F00"/>
      <stop offset="100%" style="stop-color:#0A0800"/>
    </radialGradient>
  </defs>

  <!-- Halo -->
  <circle cx="24" cy="24" r="22" fill="none"
    stroke="#F0B429" stroke-width="2" opacity="0.3" filter="url(#halo)"/>

  <!-- Fond -->
  <circle cx="24" cy="24" r="22" fill="url(#circleGrad2)"/>

  <!-- Bordure dorée -->
  <circle cx="24" cy="24" r="22" fill="none"
    stroke="url(#goldGrad2)" stroke-width="1.8" filter="url(#glow)"/>

  <!-- A stylisé -->
  <path d="M24 7 L39 39 L9 39 Z"
    fill="none" stroke="url(#goldGrad2)" stroke-width="2.5"
    stroke-linejoin="round" stroke-linecap="round"
    filter="url(#glow)"/>
  <line x1="14.5" y1="30" x2="33.5" y2="30"
    stroke="url(#goldGrad2)" stroke-width="2.5"
    stroke-linecap="round" filter="url(#glow)"/>

  <!-- Glow points extrémités -->
  <circle cx="24" cy="7" r="3" fill="#FFD700" filter="url(#glow-strong)" opacity="0.95"/>
  <circle cx="9" cy="39" r="2.5" fill="#F0B429" filter="url(#glow-strong)" opacity="0.85"/>
  <circle cx="39" cy="39" r="2.5" fill="#F0B429" filter="url(#glow-strong)" opacity="0.85"/>

  <!-- Reflet -->
  <path d="M 8 18 Q 24 8 40 18" fill="none"
    stroke="white" stroke-width="1" opacity="0.12" stroke-linecap="round"/>
</svg>
