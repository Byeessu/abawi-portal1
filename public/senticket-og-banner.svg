<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#0D2137"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F0B429"/>
      <stop offset="100%" stop-color="#E5A820"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="white" stroke-width="0.4" opacity="0.04"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="120" r="200" fill="#22C55E" opacity="0.05"/>
  <circle cx="150" cy="520" r="150" fill="#22C55E" opacity="0.04"/>
  <circle cx="600" cy="650" r="300" fill="#F0B429" opacity="0.03"/>

  <!-- Left ticket shape -->
  <rect x="80" y="180" width="340" height="220" rx="18" fill="#22C55E" opacity="0.12" stroke="#22C55E" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Ticket notch left -->
  <circle cx="80" cy="290" r="20" fill="url(#bg)"/>
  <!-- Ticket notch right -->
  <circle cx="420" cy="290" r="20" fill="url(#bg)"/>
  <!-- Ticket dashed line -->
  <line x1="100" y1="290" x2="400" y2="290" stroke="#22C55E" stroke-width="2" stroke-dasharray="12 8" opacity="0.4"/>
  <!-- Ticket icon lines -->
  <rect x="110" y="210" width="160" height="12" rx="6" fill="#22C55E" opacity="0.35"/>
  <rect x="110" y="234" width="110" height="10" rx="5" fill="#22C55E" opacity="0.25"/>
  <rect x="110" y="312" width="80" height="10" rx="5" fill="#F0B429" opacity="0.5"/>
  <rect x="200" y="312" width="50" height="10" rx="5" fill="#22C55E" opacity="0.3"/>
  <!-- QR code hint -->
  <rect x="330" y="310" width="60" height="60" rx="6" fill="none" stroke="#22C55E" stroke-width="1.5" opacity="0.4"/>
  <rect x="338" y="318" width="18" height="18" rx="2" fill="#22C55E" opacity="0.3"/>
  <rect x="362" y="318" width="18" height="18" rx="2" fill="#22C55E" opacity="0.3"/>
  <rect x="338" y="342" width="18" height="18" rx="2" fill="#22C55E" opacity="0.3"/>
  <rect x="362" y="342" width="8" height="8" rx="1" fill="#22C55E" opacity="0.3"/>
  <rect x="374" y="342" width="8" height="8" rx="1" fill="#22C55E" opacity="0.3"/>

  <!-- Main content area -->
  <!-- SenTicket icon badge -->
  <rect x="540" y="165" width="78" height="78" rx="20" fill="url(#green)"/>
  <!-- Ticket icon in badge -->
  <rect x="554" y="182" width="50" height="34" rx="6" fill="white" opacity="0.9"/>
  <circle cx="554" cy="199" r="7" fill="url(#green)"/>
  <circle cx="604" cy="199" r="7" fill="url(#green)"/>
  <line x1="561" y1="199" x2="597" y2="199" stroke="white" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>
  <rect x="554" y="224" width="50" height="9" rx="4.5" fill="white" opacity="0.7"/>

  <!-- SenTicket title -->
  <text x="636" y="210" font-family="Arial, sans-serif" font-size="38" font-weight="900" fill="white" letter-spacing="-0.5">Sen</text>
  <text x="700" y="210" font-family="Arial, sans-serif" font-size="38" font-weight="900" fill="url(#green)" letter-spacing="-0.5">Ticket</text>

  <!-- Tagline -->
  <text x="540" y="280" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="white" opacity="0.6">Billetterie événementielle au Sénégal</text>

  <!-- Divider -->
  <rect x="540" y="316" width="60" height="3" rx="2" fill="url(#green)" opacity="0.7"/>

  <!-- Features row -->
  <g transform="translate(540, 348)">
    <!-- Feature 1 -->
    <rect x="0" y="0" width="140" height="42" rx="10" fill="white" opacity="0.05" stroke="white" stroke-width="0.8" stroke-opacity="0.1"/>
    <text x="12" y="15" font-family="Arial, sans-serif" font-size="11" fill="#22C55E" font-weight="700">🎫 ÉVÉNEMENTS</text>
    <text x="12" y="32" font-family="Arial, sans-serif" font-size="10" fill="white" opacity="0.5">Concerts, conférences</text>

    <!-- Feature 2 -->
    <rect x="152" y="0" width="130" height="42" rx="10" fill="white" opacity="0.05" stroke="white" stroke-width="0.8" stroke-opacity="0.1"/>
    <text x="164" y="15" font-family="Arial, sans-serif" font-size="11" fill="#22C55E" font-weight="700">📱 MOBILE MONEY</text>
    <text x="164" y="32" font-family="Arial, sans-serif" font-size="10" fill="white" opacity="0.5">Wave, Orange Money</text>

    <!-- Feature 3 -->
    <rect x="294" y="0" width="120" height="42" rx="10" fill="white" opacity="0.05" stroke="white" stroke-width="0.8" stroke-opacity="0.1"/>
    <text x="306" y="15" font-family="Arial, sans-serif" font-size="11" fill="#F0B429" font-weight="700">⚡ QR TICKETS</text>
    <text x="306" y="32" font-family="Arial, sans-serif" font-size="10" fill="white" opacity="0.5">Entrée instantanée</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="url(#green)" opacity="0.12"/>
  <rect x="0" y="590" width="1200" height="1.5" fill="url(#green)" opacity="0.4"/>
  <text x="540" y="613" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.45">Propulsé par ABAWI · abawi.app</text>

  <!-- Star dots decorative -->
  <circle cx="490" cy="200" r="2" fill="#F0B429" opacity="0.6"/>
  <circle cx="470" cy="330" r="1.5" fill="#22C55E" opacity="0.5"/>
  <circle cx="510" cy="430" r="1" fill="white" opacity="0.4"/>
  <circle cx="1080" cy="300" r="2.5" fill="#F0B429" opacity="0.3"/>
  <circle cx="1120" cy="450" r="1.5" fill="#22C55E" opacity="0.3"/>
</svg>
