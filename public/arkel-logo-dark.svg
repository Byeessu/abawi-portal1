<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="420" height="110">
  <defs>
    <linearGradient id="bgG2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1F5C"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="goldG2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="420" height="110" rx="14" fill="#0F172A"/>

  <!-- Icon -->
  <rect x="6" y="6" width="98" height="98" rx="20" fill="url(#bgG2)"/>
  <ellipse cx="32" cy="26" rx="28" ry="20" fill="white" opacity="0.07"/>

  <!-- Ascending bars -->
  <rect x="18" y="68" width="20" height="26" rx="5" fill="white" opacity="0.85"/>
  <rect x="46" y="50" width="20" height="44" rx="5" fill="white" opacity="0.9"/>
  <rect x="74" y="30" width="20" height="64" rx="5" fill="white"/>

  <!-- Gold star -->
  <circle cx="84" cy="24" r="7" fill="url(#goldG2)"/>
  <path d="M84 18.5 L85.5 22.5 L89.8 22.5 L86.4 25.1 L87.7 29.1 L84 26.5 L80.3 29.1 L81.6 25.1 L78.2 22.5 L82.5 22.5 Z"
        fill="white" opacity="0.9"/>

  <!-- ARKEL — white -->
  <text x="122" y="58"
        font-family="'Arial Black', 'Arial', Helvetica, sans-serif"
        font-size="44" font-weight="900"
        fill="#FFFFFF" letter-spacing="-1">ARKEL</text>

  <!-- UP — gold -->
  <text x="297" y="58"
        font-family="'Arial Black', 'Arial', Helvetica, sans-serif"
        font-size="44" font-weight="900"
        fill="#D97706" letter-spacing="-1"> UP</text>

  <!-- CENTER -->
  <text x="124" y="82"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15" font-weight="700"
        fill="#94A3B8" letter-spacing="5.5">CENTER</text>

  <!-- Accent line -->
  <rect x="122" y="88" width="270" height="3" rx="1.5" fill="url(#goldG2)" opacity="0.75"/>

  <!-- Tagline -->
  <text x="124" y="104"
        font-family="Arial, Helvetica, sans-serif"
        font-size="10" fill="#475569" letter-spacing="1.8">FORMATION PROFESSIONNELLE · DAKAR</text>
