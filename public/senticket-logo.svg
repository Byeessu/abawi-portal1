<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <clipPath id="iconClip">
      <rect x="8" y="8" width="104" height="104" rx="22"/>
    </clipPath>
  </defs>

  <!-- ── ICON BACKGROUND ── -->
  <rect x="8" y="8" width="104" height="104" rx="22" fill="url(#iconGrad)"/>

  <!-- Subtle texture dots (decorative) -->
  <circle cx="20" cy="20" r="2" fill="white" opacity="0.12"/>
  <circle cx="100" cy="20" r="2" fill="white" opacity="0.12"/>
  <circle cx="20" cy="100" r="2" fill="white" opacity="0.12"/>
  <circle cx="100" cy="100" r="2" fill="white" opacity="0.12"/>

  <!-- ── TICKET SHAPE ── -->
  <!-- Full ticket white base -->
  <rect x="20" y="30" width="80" height="60" rx="8" fill="white" opacity="0.97"/>

  <!-- Notch left (cut-out from background) -->
  <circle cx="20" cy="60" r="8" fill="url(#iconGrad)"/>
  <!-- Notch right -->
  <circle cx="100" cy="60" r="8" fill="url(#iconGrad)"/>

  <!-- Perforation dashes -->
  <line x1="52" y1="34" x2="52" y2="86" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="3 4"/>

  <!-- ── STAR ICON (left half of ticket) ── -->
  <path d="M36 48 L38.6 56.4 L47.5 56.4 L40.5 61.5 L43 69.9 L36 64.8 L29 69.9 L31.5 61.5 L24.5 56.4 L33.4 56.4 Z"
        fill="url(#starGrad)"/>

  <!-- ── SN MONOGRAM (right half of ticket) ── -->
  <text x="76" y="67"
        font-family="'Arial Black', Arial, sans-serif"
        font-size="18" font-weight="900"
        fill="#15803D" text-anchor="middle"
        letter-spacing="-0.5">SN</text>

  <!-- ── WORDMARK ── -->
  <!-- "Sen" in green -->
  <text x="130" y="70"
        font-family="'Arial Black', 'Arial', Helvetica, sans-serif"
        font-size="46" font-weight="900"
        fill="#15803D"
        letter-spacing="-1">Sen</text>

  <!-- "Ticket" in dark charcoal -->
  <text x="242" y="70"
        font-family="'Arial Black', 'Arial', Helvetica, sans-serif"
        font-size="46" font-weight="900"
        fill="#1C1917"
        letter-spacing="-1">Ticket</text>

  <!-- Gold accent underline -->
  <rect x="130" y="80" width="330" height="4" rx="2" fill="url(#starGrad)" opacity="0.85"/>

  <!-- Tagline -->
  <text x="131" y="100"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11" fill="#9CA3AF"
        letter-spacing="2.8"
        font-weight="600">BILLETTERIE EN LIGNE · SÉNÉGAL</text>
</svg>
