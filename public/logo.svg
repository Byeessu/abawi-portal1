<svg width="160" height="48" viewBox="0 0 160 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#F0B429;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#E8960A;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#FFFFFF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F0B429;stop-opacity:0.9"/>
    </linearGradient>
    <radialGradient id="circleGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#2A1F00;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0A0800;stop-opacity:1"/>
    </radialGradient>
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Halo glow derrière le cercle -->
  <circle cx="24" cy="24" r="22" fill="none"
    stroke="#F0B429" stroke-width="1.5" opacity="0.3" filter="url(#halo)"/>
  <circle cx="24" cy="24" r="20" fill="none"
    stroke="#FFD700" stroke-width="0.5" opacity="0.5" filter="url(#halo)"/>

  <!-- Cercle principal fond sombre -->
  <circle cx="24" cy="24" r="21" fill="url(#circleGrad)"/>

  <!-- Bordure cercle dorée avec glow -->
  <circle cx="24" cy="24" r="21" fill="none"
    stroke="url(#goldGrad)" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Triangle/montagne stylisée -->
  <path d="M24 8 L36 36 L12 36 Z"
    fill="none" stroke="url(#goldGrad)" stroke-width="2"
    stroke-linejoin="round" stroke-linecap="round"
    filter="url(#glow)"/>

  <!-- Barre horizontale du A -->
  <line x1="16.5" y1="28" x2="31.5" y2="28"
    stroke="url(#goldGrad)" stroke-width="2"
    stroke-linecap="round" filter="url(#glow)"/>

  <!-- Glow points extrémités -->
  <circle cx="24" cy="8" r="2.5" fill="#FFD700" filter="url(#glow-strong)" opacity="0.9"/>
  <circle cx="12" cy="36" r="2" fill="#F0B429" filter="url(#glow-strong)" opacity="0.8"/>
  <circle cx="36" cy="36" r="2" fill="#F0B429" filter="url(#glow-strong)" opacity="0.8"/>

  <!-- Reflet subtil -->
  <path d="M 10 16 Q 24 8 38 16" fill="none"
    stroke="white" stroke-width="0.8" opacity="0.15"
    stroke-linecap="round"/>

  <!-- Texte ABAWI -->
  <text x="54" y="30"
    font-family="'Arial Black', 'Arial Bold', Gadget, sans-serif"
    font-size="18"
    font-weight="900"
    fill="url(#textGrad)"
    letter-spacing="2"
    filter="url(#glow)">ABAWI</text>

  <!-- Sous-texte -->
  <text x="55" y="40"
    font-family="Arial, sans-serif"
    font-size="6.5"
    font-weight="400"
    fill="#F0B429"
    letter-spacing="3.5"
    opacity="0.7">EXCELLENCE AFRICAINE</text>
</svg>
