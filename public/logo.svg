<svg width="200" height="48" viewBox="0 0 200 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Text "Abawi" -->
  <text x="0" y="36"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="32" font-weight="700"
        fill="#FFFFFF"
        letter-spacing="0.5">Abawi</text>
  <!-- Icon -->
  <g transform="translate(130, 8) scale(0.55)" fill="#4CAF50" filter="url(#glow)">
    <rect x="-26" y="-9" width="52" height="18" rx="4" transform="translate(29,48) rotate(-5)"/>
    <rect x="-9" y="-23" width="18" height="46" rx="4" transform="translate(46,65) rotate(-21)"/>
    <rect x="-8" y="-12" width="16" height="24" rx="3" transform="translate(37,17) rotate(-12)"/>
    <rect x="-12" y="-8" width="24" height="16" rx="3" transform="translate(76,14) rotate(16)"/>
    <rect x="-12" y="-7" width="24" height="14" rx="3" transform="translate(75,72) rotate(-8)"/>
  </g>
</svg>
