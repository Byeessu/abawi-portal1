<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <linearGradient id="iconGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="starGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="480" height="120" rx="16" fill="#0F172A"/>

  <!-- ── ICON BACKGROUND ── -->
  <rect x="8" y="8" width="104" height="104" rx="22" fill="url(#iconGrad2)"/>

  <!-- Subtle corner dots -->
  <circle cx="20" cy="20" r="2" fill="white" opacity="0.12"/>
  <circle cx="100" cy="20" r="2" fill="white" opacity="0.12"/>
  <circle cx="20" cy="100" r="2" fill="white" opacity="0.12"/>
  <circle cx="100" cy="100" r="2" fill="white" opacity="0.12"/>

  <!-- ── TICKET SHAPE ── -->
  <rect x="20" y="30" width="80" height="60" rx="8" fill="white" opacity="0.97"/>
  <circle cx="20" cy="60" r="8" fill="url(#iconGrad2)"/>
  <circle cx="100" cy="60" r="8" fill="url(#iconGrad2)"/>
  <line x1="52" y1="34" x2="52" y2="86" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="3 4"/>

  <!-- Star -->
  <path d="M36 48 L38.6 56.4 L47.5 56.4 L40.5 61.5 L43 69.9 L36 64.8 L29 69.9 L31.5 61.5 L24.5 56.4 L33.4 56.4 Z"
        fill="url(#starGrad2)"/>

  <!-- SN monogram -->
  <text x="76" y="67"
        font-family="'Arial Black', Arial, sans-serif"
        font-size="18" font-weight="900"
        fill="#15803D" text-anchor="middle"
        letter-spacing="-0.5">SN</text>

  <!-- ── WORDMARK (white on dark) ── -->
  <text x="130" y="70"
        font-family="'Arial Black', 'Arial', Helvetica, sans-serif"
        font-size="46" font-weight="900"
        fill="#22C55E"
        letter-spacing="-1">Sen</text>

  <text x="242" y="70"
        font-family="'Arial Black', 'Arial', Helvetica, sans-serif"
        font-size="46" font-weight="900"
        fill="#FFFFFF"
        letter-spacing="-1">Ticket</text>

  <!-- Gold accent underline -->
  <rect x="130" y="80" width="330" height="4" rx="2" fill="url(#starGrad2)" opacity="0.9"/>

  <!-- Tagline -->
  <text x="131" y="100"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11" fill="#6B7280"
        letter-spacing="2.8"
        font-weight="600">BILLETTERIE EN LIGNE · SÉNÉGAL</text>
</svg>
