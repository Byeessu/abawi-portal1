<svg width="160" height="48" viewBox="0 0 160 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#F0B429"/>
      <stop offset="100%" stop-color="#E8960A"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6C5CE7"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F0B429"/>
      <stop offset="30%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E1040"/>
      <stop offset="100%" stop-color="#0A0520"/>
    </radialGradient>
  </defs>

  <!-- Halo violet -->
  <circle cx="24" cy="24" r="22" fill="none" stroke="#7C3AED" stroke-width="1.5" opacity="0.25" filter="url(#glow)"/>

  <!-- Fond -->
  <circle cx="24" cy="24" r="21" fill="url(#bgGrad)"/>

  <!-- Bordure dégradée or-violet -->
  <circle cx="24" cy="24" r="21" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" filter="url(#glow)"/>

  <!-- A stylisé Abawi avec dégradé or -->
  <path d="M24 7 L39 39 L9 39 Z"
    fill="none" stroke="url(#goldGrad)" stroke-width="2.5"
    stroke-linejoin="round" stroke-linecap="round"
    filter="url(#glow)"/>
  <line x1="14.5" y1="30" x2="33.5" y2="30"
    stroke="url(#goldGrad)" stroke-width="2.5"
    stroke-linecap="round" filter="url(#glow)"/>

  <!-- Points lumineux -->
  <circle cx="24" cy="7" r="2.8" fill="#FFD700" filter="url(#glow-strong)" opacity="0.95"/>
  <circle cx="9" cy="39" r="2.2" fill="#F0B429" filter="url(#glow-strong)" opacity="0.85"/>
  <circle cx="39" cy="39" r="2.2" fill="#F0B429" filter="url(#glow-strong)" opacity="0.85"/>

  <!-- Reflet -->
  <path d="M 8 18 Q 24 8 40 18" fill="none" stroke="white" stroke-width="0.9" opacity="0.15" stroke-linecap="round"/>

  <!-- Texte ABAVIE -->
  <text x="54" y="30" font-family="Arial Black,Gadget,sans-serif" font-size="18" font-weight="900" fill="url(#textGrad)" letter-spacing="2.2" filter="url(#glow)">ABAVIE</text>

  <!-- Sous-titre -->
  <text x="55" y="40" font-family="Arial,sans-serif" font-size="6.5" font-weight="500" fill="#A78BFA" letter-spacing="3.8" opacity="0.8">MESSAGERIE</text>
</svg>
