<svg width="180" height="48" viewBox="0 0 180 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Fond circulaire -->
  <circle cx="24" cy="24" r="22" fill="url(#greenGrad)" opacity="0.1"/>
  <circle cx="24" cy="24" r="22" fill="none" stroke="url(#greenGrad)" stroke-width="1.5" opacity="0.3" filter="url(#glow)"/>

  <!-- Croix médicale stylisée -->
  <rect x="18" y="8" width="12" height="32" rx="3" fill="url(#crossGrad)" filter="url(#glow)"/>
  <rect x="8" y="18" width="32" height="12" rx="3" fill="url(#crossGrad)" filter="url(#glow)"/>

  <!-- Centre brillant -->
  <circle cx="24" cy="24" r="5" fill="#fff" opacity="0.9" filter="url(#glow)"/>

  <!-- Texte ABAVIE -->
  <text x="54" y="30" font-family="Arial Black,Gadget,sans-serif" font-size="20" font-weight="900" fill="url(#textGrad)" letter-spacing="2">ABAVIE</text>

  <!-- Sous-titre Santé -->
  <text x="55" y="40" font-family="Arial,sans-serif" font-size="7" font-weight="600" fill="#059669" letter-spacing="4" opacity="0.9">SANTÉ</text>
</svg>
