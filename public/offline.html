<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABAWI - Hors ligne</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #070B0F 0%, #0D1117 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      text-align: center;
      max-width: 400px;
    }
    
    .icon {
      width: 100px;
      height: 100px;
      margin: 0 auto 30px;
      background: linear-gradient(135deg, #18A84A, #16a085);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      box-shadow: 0 10px 40px rgba(24, 168, 74, 0.3);
    }
    
    h1 {
      font-size: 1.8rem;
      margin-bottom: 15px;
      font-weight: 700;
    }
    
    p {
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.6;
      margin-bottom: 30px;
    }
    
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    button {
      padding: 14px 28px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .primary {
      background: linear-gradient(135deg, #18A84A, #16a085);
      color: #fff;
    }
    
    .primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(24, 168, 74, 0.4);
    }
    
    .secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    
    .status {
      margin-top: 30px;
      padding: 12px 20px;
      background: rgba(255, 193, 7, 0.1);
      border: 1px solid rgba(255, 193, 7, 0.3);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.9rem;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      background: #FFC107;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Vous êtes hors ligne</h1>
    <p>La connexion internet semble être interrompue. Certaines fonctionnalités peuvent être limitées.</p>
    
    <div class="actions">
      <button class="primary" onclick="window.location.reload()">
        🔄 Réessayer
      </button>
      <button class="secondary" onclick="window.location.href='/'">
        🏠 Retour à l'accueil
      </button>
    </div>
    
    <div class="status">
      <span class="status-dot"></span>
      <span>En attente de connexion...</span>
    </div>
  </div>
  
  <script>
    // Vérifier la connexion périodiquement
    setInterval(() => {
      if (navigator.onLine) {
        window.location.reload()
      }
    }, 5000)
    
    // Écouter l'événement online
    window.addEventListener('online', () => {
      window.location.reload()
    })
  </script>
</body>
</html>
