<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- ABAWI symbol — white on green, bold shapes visible at 16px+ -->
  <rect width="100" height="100" rx="18" fill="#18A84A"/>

  <!-- Horizontal bar (left arm of ">") -->
  <rect x="-26" y="-9" width="52" height="18" rx="4" fill="white"
    transform="translate(29 48) rotate(-5)"/>

  <!-- Diagonal arm (goes down-left from vertex) -->
  <rect x="-9" y="-23" width="18" height="46" rx="4" fill="white"
    transform="translate(46 65) rotate(-21)"/>

  <!-- Fragment: top-center -->
  <rect x="-8" y="-12" width="16" height="24" rx="3" fill="white"
    transform="translate(37 17) rotate(-12)"/>

  <!-- Fragment: upper-right -->
  <rect x="-12" y="-8" width="24" height="16" rx="3" fill="white"
    transform="translate(76 14) rotate(16)"/>

  <!-- Fragment: lower-right -->
  <rect x="-12" y="-7" width="24" height="14" rx="3" fill="white"
    transform="translate(75 72) rotate(-8)"/>
</svg>
